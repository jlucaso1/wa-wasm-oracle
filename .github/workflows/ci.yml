name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Wasmtime and Cranelift dominate the build; a failure is almost never in the
  # last crate compiled, so the full output is worth having.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      # `--examples` too: without it a dead helper in one of them kept `flate2`
      # in the dependency list, and the machete step below could not see it
      # because the code referencing it still compiled.
      - name: clippy
        run: cargo clippy --all --tests --examples -- -D warnings

      # Pinned to a tag rather than @main: this is a third-party action running
      # in a job that holds a token for a private repository, and @main is
      # whatever that branch happens to be at the moment the job starts.
      - name: unused dependencies
        uses: bnjbvr/cargo-machete@v0.9.2

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Keyed on the lock: the pinned set is content-addressed, so a cache hit
      # can only ever be the same bytes, and fetch-wasm.py re-verifies them
      # anyway before deciding there is nothing to download.
      - uses: actions/cache@v4
        with:
          path: wasm
          key: wasm-${{ hashFiles('wasm.lock.json') }}

      # Not allowed to fail. Every test in this repository skips without the
      # captures, and a skipped run reports success while proving nothing —
      # which is exactly what this job did for as long as it looked for them in
      # a whatsapp-rust checkout that never carried them.
      #
      # The token is for the release fallback only. The lock's origin urls are
      # tried first and need no credentials, so a fork whose token cannot read
      # the private release still gets the whole set.
      - name: fetch captured modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-wasm.py

      - name: build
        run: cargo build --release --all-targets

      - name: test
        run: cargo test --release -- --nocapture 2>&1 | tee test-output.txt

      # The captures are present by now or the job already failed, so a skip
      # here means a test quietly stopped covering the thing it exists for.
      - name: reject silent skips
        run: |
          if grep -q "skipping:" test-output.txt; then
            echo "Tests skipped while the capture was available:"
            grep "skipping:" test-output.txt
            exit 1
          fi

  # The signaling tests bring up PJSIP's worker pool: reliable under host-driven
  # scheduling, but slow enough (~4 min) to keep out of the main run. Blocking,
  # because they now either pass or have found something.
  signaling:
    name: signaling (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: wasm
          key: wasm-${{ hashFiles('wasm.lock.json') }}
      - name: fetch captured modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-wasm.py

      - run: cargo test --release --test signaling -- --ignored --test-threads 1

  # The threaded tests bring up PJSIP's worker pool and hold a serialisation
  # lock, so they are slow but not flaky. Run repeatedly: the engine has a
  # startup race the harness can narrow and not close, and a single green run
  # would not show a retry budget quietly running out.
  threading:
    name: threads (repeated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: wasm
          key: wasm-${{ hashFiles('wasm.lock.json') }}
      - name: fetch captured modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-wasm.py

      - run: |
          for attempt in 1 2 3; do
            echo "--- run $attempt ---"
            cargo test --release --test threading || exit 1
          done
